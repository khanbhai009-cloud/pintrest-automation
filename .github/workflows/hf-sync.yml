name: Sync Private HF to GitHub

on:
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante me auto-run hoga
  workflow_dispatch: # Manual button

# Ye permission 403 error ko fix karegi
permissions:
  contents: write

jobs:
  sync-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Auto Sync Bot"
          git config --global user.email "bot@autosync.com"

      - name: Pull Latest Code from Private HF
        env:
          # Make sure GitHub secrets me aapne HF_TOKEN hi naam rakha hai
          HF_TOKEN: ${{ secrets.HF_TOKEN }} 
        run: |
          # Yahan maine aapka naya username aur repo daal diya hai (Spaces ke liye)
          HF_REPO_URL="https://user:${HF_TOKEN}@huggingface.co/spaces/ksksysy540/pinteresto"
          
          # NOTE: Agar HF par ye 'Space' nahi balki 'Model' hai, toh upar wali line hata kar ye niche wali line use karna:
          # HF_REPO_URL="https://user:${HF_TOKEN}@huggingface.co/ksksysy540/pinteresto"
          
          git remote add hf "$HF_REPO_URL"
          
          # HF se fetch karke forcefully merge karna
          git fetch hf main
          git merge hf/main --allow-unrelated-histories -m "Auto-sync latest code from Private Hugging Face"

      - name: Push to GitHub Private Repo
        run: |
          git push origin main
